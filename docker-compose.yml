version: '3.8'

services:
  agent:
    build: .
    container_name: llm-trading-agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/trading_agent.db
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep src.main || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
